# Runs when an Aistra release PR is merged into main (head branch release-* /
# prerelease-*): cuts the GitHub release — a plain semver tag <version> (e.g.
# 2.0.0) plus a zipped Aistra.xcframework asset (AistraFramework.zip) for direct
# download. Plain semver so SPM resolves it (`from: "1.0.0"`); the CocoaPods
# podspec and direct download share the same tag.
#
# By design this repo stores NO secrets: the release is created with the
# built-in, repo-scoped GITHUB_TOKEN via the GitHub CLI (`gh release`). The
# CocoaPods trunk push (the only step that needs a real credential) is a
# separate MANUAL workflow in the private source repo (iOS_deploy_pod.yml), so
# no third-party secret ever lives here.
name: Release framework

on:
  pull_request:
    types:
      - closed
    branches:
      - 'main'

permissions:
  contents: write

jobs:
  release_framework:
    if: >-
      (startsWith(github.head_ref, 'release') || startsWith(github.head_ref, 'prerelease'))
        && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # Create the release with the built-in token via gh (reliable with the
    # repo-scoped GITHUB_TOKEN; contents:write covers the tag + release + asset).
    # Idempotent so a manual re-run just refreshes the asset.
    - name: GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        version="$(jq -r '.version' version_aistra_sdk.json | sed 's/^v//')"
        tag="${version}"
        zip -qr AistraFramework.zip Aistra.xcframework
        if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
          echo "Release ${tag} exists — refreshing asset."
          gh release upload "$tag" AistraFramework.zip --repo "${GITHUB_REPOSITORY}" --clobber
        else
          gh release create "$tag" AistraFramework.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Appier Aistra iOS SDK ${version}" \
            --notes "" \
            --target main
        fi
        echo "Released ${tag}"
